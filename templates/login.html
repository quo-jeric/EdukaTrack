<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdukaTrack - Login</title>
    <link rel="icon" type="image/gif" href="/static/pixelbook.gif">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo"><img src="/static/pixelbook.gif" alt="Logo" style="width: 100%; height: 100%; border-radius: 16px; object-fit: cover;"></div>
            <h2>EdukaTrack</h2>
            <p>Student Management System</p>

            <form id="loginForm">
                <div class="login-input-group">
                    <label class="login-label">Role</label>
                    <select class="login-select" id="roleSelect" required>
                        <option value="">Select your role</option>
                        <option value="admin">Administrator</option>
                        <option value="teacher">Teacher</option>
                        <option value="student">Student</option>
                    </select>
                </div>

                <div class="login-input-group">
                    <label class="login-label">School ID</label>
                    <input type="text" class="login-input" id="schoolId" placeholder="Enter your school ID" required>
                </div>

                <div class="login-input-group">
                    <label class="login-label">Password</label>
                    <input type="password" class="login-input" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
            </form>

            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const role = document.getElementById('roleSelect').value;
            const schoolId = document.getElementById('schoolId').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            if (!role || !schoolId || !password) {
                errorDiv.textContent = 'Please fill in all fields';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ schoolId, password, role })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('session_token', data.token);
                    localStorage.setItem('user_name', data.name);
                    localStorage.setItem('user_role', role);
                    window.location.href = data.redirect;
                } else {
                    errorDiv.textContent = data.message || 'Invalid credentials';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Server connection failed';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
